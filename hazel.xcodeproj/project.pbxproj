zelWallpaperExtension-$ARCH\"\ndone\nif [ \"$(echo \"$ARCHS\" | wc -w | tr -d ' ')\" -gt 1 ]; then\nlipo -create \"$APPEX_SLICE_DIR\"/HazelWallpaperExtension-* -output \"$APPEX_MACOS/HazelWallpaperExtension\"\nelse\ncp \"$APPEX_SLICE_DIR\"/HazelWallpaperExtension-* \"$APPEX_MACOS/HazelWallpaperExtension\"\nfi\nrm -rf \"$APPEX_SLICE_DIR\"\ncp \"$PROJECT_DIR/hazel-appex/Info.plist\" \"$APPEX_CONTENTS/Info.plist\"\ncodesign --force --sign - --identifier com.live.hazel.wallpaper-extension --entitlements \"$PROJECT_DIR/hazel-appex/HazelWallpaperExtension.entitlements\" \"$APPEX_STAGING\"\nEXTDEST=\"${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}/Contents/Extensions/HazelWallpaperExtension.appex\"\nmkdir -p \"$(dirname \"$EXTDEST\")\"\nrm -rf \"$EXTDEST\"\ncp -R \"$APPEX_STAGING\" \"$EXTDEST\"\ncodesign --force --sign - --identifier com.live.hazel.wallpaper-extension --entitlements \"$PROJECT_DIR/hazel-appex/HazelWallpaperExtension.entitlements\" \"$EXTDEST\"\n";
